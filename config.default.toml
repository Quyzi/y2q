# config.default.toml — reference showing every knob and its default.
#
# Copy this file to config.toml and fill in the fields marked "required".
# Fields without a default have no compiled-in fallback and must be set.
#
# Override any value at runtime without editing the file:
#   Environment variable:  Y2QD_SECTION__KEY=value   (double-underscore for nesting)
#   Command-line:          y2qd --set section.key=value

# ---------------------------------------------------------------------------
# [server] — HTTP listener
# ---------------------------------------------------------------------------
[server]
host             = "127.0.0.1"  # required — IP address to bind
port             = 8080         # required — TCP port

# Maximum request body size accepted for PUT uploads.
max_body_bytes = 268435456  # 256 MiB

# When true, the Prometheus scrape endpoint (/metrics/prometheus) and OpenAPI
# document (/api-docs/openapi.json) are reachable without a Bearer token. Keep
# false in production.
unauthenticated_metrics = false

# ---------------------------------------------------------------------------
# [server.actix] — actix HttpServer tuning knobs
#
# The entire section is optional. Omitting it leaves actix's own defaults.
# ---------------------------------------------------------------------------
[server.actix]

# Number of worker threads. Comment out (or remove) to use the number of
# logical CPUs reported by the OS.
# workers = 4

# TCP listen backlog — depth of the kernel's accept queue.
backlog = 1024

# Maximum concurrent connections handled per worker thread.
max_connections = 25000

# Keep-alive idle timeout in seconds. Set to 0 to disable keep-alive.
keep_alive_secs = 5

# How long to wait for the first request bytes after accepting a connection,
# in seconds. Connections that stay silent longer are closed.
client_request_timeout_secs = 5

# How long to wait for the client to close its side of the connection after
# the final response has been sent, in seconds.
client_disconnect_timeout_secs = 1

# Graceful shutdown window in seconds. In-flight requests have this long to
# complete after a SIGTERM before the process exits.
shutdown_timeout_secs = 30

# ---------------------------------------------------------------------------
# [server.tls] — HTTPS / TLS listener
#
# When enabled = true, the daemon binds HTTPS at [server] port using rustls
# and refuses plaintext HTTP entirely. Both cert_path and key_path must be
# set and point to PEM-encoded files. The private key may be PKCS#8, PKCS#1,
# or SEC1 encoded.
#
# To run plaintext HTTP and HTTPS side by side, run two y2qd processes on
# different ports — this section flips a single listener between modes.
#
# y2qd refuses to start if TLS is disabled AND [server] host is a
# non-loopback address, since that would serve session tokens, passwords,
# and object plaintext unencrypted to the network. Loopback binds
# (127.0.0.1/::1) are always exempt. To bind non-loopback without TLS
# anyway (e.g. behind a TLS-terminating reverse proxy on a trusted
# network), set [server] allow_insecure_bind = true explicitly.
#
# y2qd also refuses to start if guarded memory is unavailable (e.g.
# RLIMIT_MEMLOCK too low to lock session key pages out of swap) — core
# dumps and swap would otherwise expose live session identity keys. To
# override (not recommended outside local development), set
# [server] allow_unprotected_memory = true explicitly.
# ---------------------------------------------------------------------------
[server.tls]
enabled   = false
# cert_path = "/etc/y2q/tls/fullchain.pem"
# key_path  = "/etc/y2q/tls/privkey.pem"
#
# Optional: enforce mutual TLS. When set, every client must present a
# certificate that chains to one of the CAs in this PEM bundle; otherwise the
# handshake is rejected. Leave unset to accept any client without client-cert
# verification.
# client_ca_path = "/etc/y2q/tls/client-ca.pem"
#
# Require a post-quantum (X25519MLKEM768 hybrid) key exchange on every TLS
# handshake. When true (default), the daemon offers ONLY the PQ-hybrid group;
# clients that cannot negotiate it are refused at handshake time. Set to false
# to fall back to the default rustls preference list (PQ preferred but classic
# X25519/ECDH groups still offered).
require_pq_kex = true

# ---------------------------------------------------------------------------
# [storage] — object storage backend
# ---------------------------------------------------------------------------
[storage]

# Storage backend implementation.
#   "filesystem"  — portable tokio::fs backend (default)
#   "uring"       — Linux io_uring fast path (Linux only, kernel ≥ 5.6)
backend = "filesystem"

# Root directory for stored objects. Created on first write if absent.
base_path = "/var/lib/y2q/data"  # required

# Path to the redb metadata index. Defaults to <base_path>/_y2q_index.redb.
# index_path = "/var/lib/y2q/data/_y2q_index.redb"

# Limits on X-Y2Q-<label> custom headers accepted on PUT requests.
max_labels            = 32    # maximum number of label headers per request
max_label_name_bytes  = 64    # maximum byte length of a label name
max_label_value_bytes = 1024  # maximum byte length of a label value

# Background fsync interval for best-effort PUTs (seconds). The daemon
# fsyncs all pending dirty objects at this cadence. Minimum: 1. Default: 5.
sync_flush_interval_secs = 5

# Queue depth that triggers an immediate fsync pass before the timer fires.
# When this many best-effort PUTs are pending flush, the flusher wakes early.
# Entries are never dropped — this is a watermark, not a hard cap. Default: 64.
sync_flush_limit = 64

# Default durability for PUT requests that omit the X-Y2Q-Sync header.
#   "durable"      — fdatasync on the object file + fsync on the parent directory
#                    before returning success. Crash-safe. (default)
#   "best-effort"  — no fsync. Higher throughput; an unclean shutdown can lose
#                    a recently-PUT object even though the API returned success.
# Per-request override: X-Y2Q-Sync: best-effort  (or: durable)
default_sync = "durable"

# ---------------------------------------------------------------------------
# [storage.uring] — io_uring ring builder tunables (Linux only)
# Only relevant when backend = "uring". All options default to tokio-uring's
# own defaults and can be omitted entirely.
# ---------------------------------------------------------------------------
# [storage.uring]

# Number of dedicated io_uring worker threads. Defaults to logical CPU count.
# workers = 8

# Submission queue (SQ) ring size. Must be a power of two. Default: 256.
# sq_entries = 256

# Completion queue (CQ) ring size. Omit to let the kernel choose (≥ 2x sq_entries).
# cq_entries = 512

# Enable kernel-side SQ polling thread (IORING_SETUP_SQPOLL). Eliminates
# io_uring_enter syscalls on the submission hot path. Requires CAP_SYS_NICE
# or CAP_SYS_ADMIN. Default: false.
# sq_poll = false

# Milliseconds before the SQ poll thread sleeps when idle. Only meaningful
# when sq_poll = true. Default: 2000.
# sq_poll_idle_ms = 2000

# Pin the SQ poll thread to a specific CPU. Omit for no affinity. Only
# meaningful when sq_poll = true.
# sq_poll_cpu = 0

# Busy-poll for I/O completions (IORING_SETUP_IOPOLL). Reduces latency on
# NVMe devices that support polled I/O. Default: false.
# io_poll = false

# Declare single-thread submission (IORING_SETUP_SINGLE_ISSUER). Each worker
# thread owns its own ring, so this is always accurate and enables kernel
# optimisations. Default: true.
# single_issuer = true

# Cooperative task-run scheduling (IORING_SETUP_COOP_TASKRUN). Reduces
# interrupt overhead at the cost of slightly higher per-task latency.
# Default: false.
# coop_taskrun = false

# Object size threshold (bytes) at or above which writes switch to the O_DIRECT
# path with aligned buffers. Below this, buffered uring writes are used.
# Default: 4194304 (4 MiB).
# large_object_bytes = 4194304

# ---------------------------------------------------------------------------
# [crypto] — keystore and key-derivation settings
# ---------------------------------------------------------------------------
[crypto]

# Directory holding keystore.json, users.redb, and the daemon-wide lock file.
# Must NOT be located under storage.base_path — keep keys and data separate.
keystore_dir = "/var/lib/y2q/keys"  # required

# Node key: protects the metadata index, the on-disk path blinding, and
# object metadata sidecars. In operator mode it is supplied by you and is
# never auto-generated; when set it takes precedence at boot. Without it the
# daemon recovers the key from the device registry (<keystore_dir>/devices.json,
# see [crypto.devices] below) or refuses to start. The file may
# hold raw bytes, hex, or base64; Y2QD_NODE_KEY takes precedence and accepts
# the same text forms. Minimum 32 bytes; more is accepted but adds nothing,
# because every key derived from it is 256-bit.
#
# It MUST be CSPRNG output. A passphrase will be accepted if it happens to
# decode to 32+ bytes, and it will be crackable: anyone holding the storage
# tree can test candidates offline at HMAC speed. Generate it with
# `y2q admin gen-node-key --output PATH` (creates it mode 0400, refuses to
# overwrite), `openssl rand -base64 32`, or `head -c 32 /dev/urandom`: for the
# latter two use `(umask 077; ... > node.key)` and `chmod 0400`.
#
# The daemon refuses to start if the file is accessible to group or other
# (mode & 0o077 != 0; e.g. 0400 or 0600 is fine, 0644 or 0440 is not) and
# requires a regular file of at most 4 KiB. The daemon user must own/read it.
# The mode rule does not apply to Y2QD_NODE_KEY.
#
# Do NOT place this file inside storage.base_path or crypto.keystore_dir —
# the daemon refuses to start if you do, because a copy of the data would
# carry the key that protects it.
# node_key_file = "/run/secrets/y2q-node-key"

# Plaintext chunk size (bytes) for v2 streaming encryption. Default 4 MiB.
# Recorded per-object in the envelope header, so changing it only affects objects
# written AFTER the change — existing objects keep decrypting with their own stored
# size. Smaller chunks make ranged reads finer-grained but add per-chunk overhead.
# Bounds: 65536 (64 KiB) .. 268435456 (256 MiB).
envelope_chunk_size_bytes = 4194304

# Device-unlock transport settings: how to reach the TPM and the time source.
# Ignored unless <keystore_dir>/devices.json exists and y2qd was built with the
# `devices` feature. The away-device window length is NOT configured here: it is
# registry policy, set by `y2q admin device init --away-grant-seconds` and
# changed only by `y2q admin device set-grant-period`.
[crypto.devices]
tpm_tcti = "device:/dev/tpmrm0"
# Seconds between grant sweeps. A daemon booted by a home device also re-mints
# away grants on each tick. 60 .. 86400.
grant_timer_interval_seconds = 900

# Key helper (privilege separation). Helper mode isolates the TPM / FIDO2 unseal,
# devices.json and the Registry Master Key from the network-facing daemon uid.
# No resident process holds RMK: a systemd socket unit (`Accept=yes`) spawns a
# fresh `y2qd --key-serve` per connection, as the key-owner uid (TPM / hidraw
# access, owns devices.json). It handles exactly one request and exits.
#
#   arm   (peer uid = key_agent_arm_uid, default root): stores ONE-TIME
#         authorization (passcode, FIDO2 PIN, emergency code) in
#         <key_agent_state_dir>/armed. Unattended hosts arm with empty
#         authorization from `ExecStartPre=+/usr/local/bin/y2q-keyarm` before
#         every daemon start; attended hosts (a home device with a second factor)
#         arm interactively: `y2q-keyarm --prompt-passcode|--prompt-pin|
#         --prompt-emergency-code` sends the secret over the socket, never via
#         an environment variable or a file. `y2qd --key-arm` remains a
#         compatibility alias.
#   fetch (peer uid = key_agent_peer_uid, the daemon's uid): the helper consumes
#         the armed file (every attempt deletes it), unlocks the registry with
#         that material and returns the node key once. A fetch without a prior
#         arm is refused, so a compromised daemon uid can connect but cannot
#         re-fetch the node key or RMK.
#
# `y2qd --key-sweep` (run from a systemd timer) refreshes / sweeps away grants
# through an unattended home unlock. A home device with a second factor cannot
# be unlocked unattended: the sweep then logs and exits 0, and grants are
# refreshed at arm+boot unlocks and by `y2q admin device refresh`.
#
# Operator-supplied node keys still take precedence over the helper.
# An EMPTY socket (the default) is the legacy in-process mode: the daemon itself
# holds hardware access and RMK and keeps the grant timer, so anything running
# as the daemon uid can repeat the unseal. This is the weaker mode; use it only
# when a second uid is not available. The daemon still receives one transient
# raw node-key copy at boot in either mode, and root on the live host defeats
# both.
# Must be an absolute path. Set it identically for the daemon, the helper and
# the arm client.
key_agent_socket = ""
# The only uid a `fetch` is served to (the daemon's uid). Required by --key-serve.
# key_agent_peer_uid = 990
# The only uid an `arm` is accepted from. Default 0 (root).
key_agent_arm_uid = 0
# Directory for the armed authorization. Must be absolute, exist, be owned by
# the helper's uid and have mode 0700 (systemd: RuntimeDirectory=y2q-keyd,
# RuntimeDirectoryMode=0700 on the helper's service gives /run/y2q-keyd).
key_agent_state_dir = "/run/y2q-keyd"
# Daemon-side read/write timeout for the helper exchange, in seconds; it must
# cover an interactive touch / PIN on the helper. 5 .. 900.
key_agent_timeout_seconds = 180

[crypto.devices.roughtime]
# Attested time for away-device grants. There is no host-clock fallback.
# min_responses is the number of independent servers that must answer.
timeout_ms    = 3000   # 200 .. 30000
min_responses = 2      # 2 .. 16
# The server list ships EMPTY on purpose: keys rotate, several published keys
# have no primary source, and interop with the RFC 10049 framing varies by
# server. Run `y2q admin device check-time` before relying on any entry.
# [[crypto.devices.roughtime.servers]]
# name = "example"
# addr = "<host>:<port>"
# public_key_b64 = "<base64 Ed25519 key, copied from the server operator>"
# Verify every entry with `y2q admin device check-time` before use; prefer a self-hosted roughenough server for anything load-bearing.

[crypto.argon2]
# Argon2id parameters used when hashing passwords for new user records.
m_cost_kib = 65536  # memory cost — 64 MiB
t_cost     = 3      # time cost (iterations)
p_cost     = 4      # parallelism (lanes)

# ---------------------------------------------------------------------------
# [auth] — session and account-lockout policy
# ---------------------------------------------------------------------------
[auth]

# Default session lifetime when the login request omits ttl_seconds.
default_ttl_seconds = 3600  # 1 hour

# Hard ceiling. Login requests specifying ttl_seconds above this are rejected.
max_ttl_seconds = 86400  # 24 hours

# How often the background task sweeps expired sessions from memory.
session_sweep_interval_seconds = 300  # 5 minutes

# Minimum delay before a failed-login response is returned, in milliseconds.
# Argon2id already dominates this; the floor smooths timing differences
# between known and unknown usernames.
min_login_response_ms = 250

# Consecutive failed logins before the account is locked. 0 disables lockout.
max_failed_logins = 10

# How long an account stays locked after exceeding max_failed_logins.
lockout_seconds = 900  # 15 minutes

# Enforce bucket ownership/ACLs and the global admin role. When true (default),
# new buckets are private to their creator, access is governed by per-bucket
# grants, and admin endpoints (user management, index rebuild, lock clearing,
# trace) require an admin account. Set false for a single-user or migration
# deployment where every authenticated user should have full access.
enforce_authorization = true

# Maximum number of times a session's token may be refreshed via
# POST /api/v1/auth/refresh before the refresh operation itself starts
# being rejected with 403. 0 (default) disables refresh entirely: the very
# first refresh attempt on any token is rejected. A token that has hit its
# limit is NOT revoked — it keeps authenticating normally for every other
# endpoint until it naturally expires; only further refreshing is denied,
# so a session's total lifetime can never be extended past
# default_ttl_seconds * (max_refreshes + 1) without a fresh login (each
# refresh grants a fresh default_ttl_seconds window, not ttl_seconds — the
# refresh endpoint takes no body).
max_refreshes = 0

# ---------------------------------------------------------------------------
# [s3] — optional S3-compatible gateway (second listener, disabled by default)
#
# When enabled, y2qd binds a second listener speaking AWS S3 REST semantics
# (SigV4 auth, XML bodies, ranged GET, multipart upload, tagging, delimiter
# listings) in addition to the native REST API on [server]. Every S3 request
# still resolves to a live session through the same SessionStore as the REST
# listener, so logout, expiry, revocation, and duress persona switches all
# take effect on the S3 surface immediately, mid-transfer included.
#
# There is no password authentication on this listener at all: S3 access
# uses temporary credentials (access key id / secret access key) minted over
# the authenticated REST API via POST /api/v1/s3/credentials. A minted
# credential's expiry is always clamped to its owning session's expiry — it
# can never outlive the session that minted it.
#
# region must match what S3 clients are configured with; a mismatch fails
# the request rather than silently accepting it. virtual_host_domain = ""
# (default) accepts only path-style addressing (http://host:port/bucket/key);
# set it to a base domain (e.g. "s3.example.com") to also accept
# virtual-hosted addressing (http://bucket.s3.example.com/key).
#
# Only CRC32 and SHA256 are supported for x-amz-checksum-* / aws-chunked
# trailer checksums; other algorithms are rejected with 400 rather than
# silently unverified (set AWS_REQUEST_CHECKSUM_CALCULATION=when_required on
# aws-cli/boto3 clients that default to an unsupported one). Content-MD5 is
# accepted but not verified — the body is already covered by TLS in transit
# and per-chunk AEAD tags at rest, and MD5 is not a workspace dependency.
# ---------------------------------------------------------------------------
[s3]
enabled = false
host    = "127.0.0.1"
port    = 9000
region  = "y2q"

# virtual_host_domain = "s3.example.com"

# Default lifetime (seconds) for a minted S3 credential when the mint
# request omits ttl_seconds. Always clamped to the owning session's expiry.
default_credential_ttl_seconds = 3600

# Maximum live S3 credentials per session. Minting past this FIFO-evicts
# the session's oldest credential.
max_credentials_per_session = 4

# Re-validate the owning session during a transfer after this many bytes,
# and at least this often regardless of byte count. A revoked, expired, or
# duress-switched session aborts the transfer at the next check.
session_recheck_bytes         = 8388608  # 8 MiB
session_recheck_interval_secs = 5

# Maximum accepted X-Amz-Date deviation from server time, in seconds.
max_clock_skew_secs = 900

# Maximum bytes accepted for a single multipart upload part. Must be at
# least 5242880 (S3's own minimum part size) and at most [server] max_body_bytes.
max_part_bytes = 67108864  # 64 MiB

# Maximum in-flight multipart uploads a single session may hold; a
# CreateMultipartUpload past this cap is rejected with 503 SlowDown.
max_uploads_per_session = 16

# Age (seconds) past which an in-flight multipart upload is aborted by the
# background sweeper regardless of whether its owning session is still live.
upload_max_age_secs = 86400

# Same override as [server] allow_insecure_bind, scoped to this listener.
allow_insecure_bind = false

[s3.tls]
enabled   = false
# cert_path = "/etc/y2q/tls/fullchain.pem"
# key_path  = "/etc/y2q/tls/privkey.pem"
# client_ca_path = "/etc/y2q/tls/client-ca.pem"
require_pq_kex = true

# ── Observability ─────────────────────────────────────────────────────────────
[observability]

# Logging filter directive, in RUST_LOG syntax. Controls which crates and
# modules emit log output and at what level.
# Examples: "info", "y2qd=debug,actix_web=info"
# The RUST_LOG environment variable takes precedence over this value when set.
log_filter = "info"

# Log output format.
# "text" — human-readable coloured output (default).
# "json" — structured JSON, one object per line; suited for log aggregators
#          such as Grafana Loki, Elasticsearch, or Datadog.
log_format = "text"
