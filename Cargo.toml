[workspace]
members = [
    "crates/y2q-behavior",
    "crates/y2q-cli",
    "crates/y2q-client",
    "crates/y2q-config",
    "crates/y2q-core",
    "crates/y2q-fuse",
    "crates/y2q-warp",
    "crates/y2qd",
]
resolver = "2"

[workspace.package]
version = "1.0.16"

[workspace.dependencies]
actix-governor              = "0.10"
actix-web                   = "4"
aes-gcm                     = { version = "0.11", features = ["zeroize"] }
aligned-vec                 = "0.6"
argon2                      = "0.6"
async-trait                 = "0.1"
base64                      = "0.23"
bytes                       = { version = "1.12", features = ["serde"] }
chrono                      = "0.4"
clap                        = { version = "4", features = ["derive", "env"] }
crc32fast                   = "1.5"
criterion                   = { version = "0.8", features = ["async_tokio"] }
# Feature-only: enables `event-stream` on the crossterm instance ratatui
# re-exports (`ratatui::crossterm`), which ratatui-crossterm never forwards.
# No direct `use crossterm::…` remains anywhere in the workspace.
crossterm                   = { version = "0.29", default-features = false, features = ["event-stream"] }
csv                         = "1.4"
dashmap                     = "6"
directories                 = "6"
figment                     = { version = "0.10.19", features = ["toml", "env"] }
flume                       = "0.12"
futures-util                = "0.3"
hdrhistogram                = "7"
hkdf                        = "0.13"
hmac                        = "0.13"
humantime                   = "2"
indexmap                    = { version = "2", features = ["serde"] }
libc                        = "0.2"
metrics                     = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
ml-kem                      = { version = "0.3.2", features = ["zeroize"] }
pest                        = "2"
pest_derive                 = "2"
rand                        = "0.10"
ratatui                     = { version = "0.30", features = ["crossterm"] }
redb                        = "4.3"
regex                       = "1"
reqwest                     = { version = "0.13", features = ["json", "stream", "query", "rustls-no-provider"], default-features = false }
rpassword                   = "7"
rustls                      = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "tls12", "std", "prefer-post-quantum"] }
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
sha2                        = "0.11"
subtle                      = "2"
tempfile                    = "3"
thiserror                   = "2.0.18"
tokio                       = { version = "1.53", features = ["full"] }
tokio-uring                 = "0.5"
tokio-util                  = { version = "0.7", features = ["io", "codec"] }
toml                        = "1.1"
tracing                     = "0.1.44"
tracing-actix-web           = "0.7"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "json"] }
utoipa                      = "5"
webpki-roots                = "1"
xxhash-rust                 = { version = "0.8", features = ["xxh3"] }
zeroize                     = { version = "1", features = ["derive"] }
zstd                        = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
