# Install as /etc/tmpfiles.d/y2q-keyd.conf, then: systemd-tmpfiles --create
# Holds the one-time armed file. It must outlive each one-shot helper, so this is a
# tmpfiles entry and not RuntimeDirectory= (which is removed when the unit stops).
d /run/y2q-keyd 0700 y2q-keyd y2q -
# The daemon's keystore flock file. Whichever process touches it first creates it with
# its own umask; if the key uid (CLI `y2q admin device ...`, registry init) created it
# 0600/0644 the daemon uid could not open it read+write and would refuse to boot.
# Pre-create it group-writable so the units' UMask=0077 does not matter. The path must
# equal [crypto] keystore_dir, and both uids must be in group y2q.
f /var/lib/y2q/keystore/.lock 0660 y2qd y2q -
