[package]
name = "y2q-core"
version.workspace = true
license-file.workspace = true
edition = "2024"

[features]
default = []
# Device-based node-key unlock (TPM 2.0 home devices, FIDO2 away devices, Roughtime).
devices = ["dep:tss-esapi", "dep:ctap-hid-fido2", "dep:roughenough-client", "dep:roughenough-protocol"]

[dependencies]
aes-gcm         = { workspace = true }
argon2          = { workspace = true }
base64          = { workspace = true }
bytes           = { workspace = true }
crc32fast       = { workspace = true }
dashmap         = { workspace = true }
flume           = { workspace = true }
hkdf            = { workspace = true }
hmac            = { workspace = true }
metrics         = { workspace = true }
ml-kem          = { workspace = true }
pest            = { workspace = true }
pest_derive     = { workspace = true }
rand            = { workspace = true }
redb            = { workspace = true }
regex           = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
sha2            = { workspace = true }
subtle          = { workspace = true }
thiserror       = { workspace = true }
tokio           = { workspace = true }
tracing         = { workspace = true }
xxhash-rust     = { workspace = true }
zeroize         = { workspace = true }

# Linux-only fast-path deps for the io_uring storage backend. Always compiled
# on Linux; absent on other targets, where `UringStorage` does not exist and
# selecting it at runtime returns an error.
[target.'cfg(target_os = "linux")'.dependencies]
aligned-vec   = { workspace = true }
libc          = { workspace = true }
tokio-uring   = { workspace = true }
ctap-hid-fido2       = { workspace = true, optional = true }
roughenough-client   = { workspace = true, optional = true }
roughenough-protocol = { workspace = true, optional = true }
tss-esapi            = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile  = { workspace = true }

[[bench]]
name    = "storage"
harness = false

[[bench]]
name    = "crypto"
harness = false

[[bench]]
name    = "index"
harness = false
